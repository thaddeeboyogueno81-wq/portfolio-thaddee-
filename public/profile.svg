<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad1)" rx="200" ry="200"/>
  
  <!-- Avatar Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#grad2)" opacity="0.3"/>
  
  <!-- Initials -->
  <text x="200" y="200" text-anchor="middle" dominant-baseline="middle" 
        font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="800" 
        fill="white" letter-spacing="2">
    TB
  </text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="30" fill="white" opacity="0.2"/>
  <circle cx="300" cy="300" r="25" fill="white" opacity="0.2"/>
  <circle cx="300" cy="100" r="20" fill="white" opacity="0.2"/>
  <circle cx="100" cy="300" r="15" fill="white" opacity="0.2"/>
</svg>
